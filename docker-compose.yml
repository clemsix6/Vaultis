services:
  hardhat-node:
    build: ./smart-contracts
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8545"]
      interval: 2s
      timeout: 5s
      retries: 30

  deployer:
    build: ./smart-contracts
    command: sh scripts/deploy-local.sh
    depends_on:
      hardhat-node:
        condition: service_healthy
    volumes:
      - contracts-abi:/abi-out
      - shared:/shared

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      deployer:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Load contract addresses from deployer
        if [ -f /shared/env-contracts ]; then
          export $(cat /shared/env-contracts | xargs)
        fi
        # Map NEXT_PUBLIC_* vars to backend-expected names
        export KYC_REGISTRY_ADDRESS=$NEXT_PUBLIC_KYC_REGISTRY_ADDRESS
        export WATCH_NFT_ADDRESS=$NEXT_PUBLIC_WATCH_NFT_ADDRESS
        export SHARES_ADDRESS=$NEXT_PUBLIC_WATCH_SHARES_ADDRESS
        export POOL_ADDRESS=$NEXT_PUBLIC_SWAP_POOL_ADDRESS
        export RPC_URL=http://hardhat-node:8545
        export PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
        export FRONTEND_URL=http://localhost:3000
        export PORT=3001
        npm start

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      deployer:
        condition: service_completed_successfully
    volumes:
      - contracts-abi:/app/src/contracts
      - shared:/shared
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /shared/env-contracts .env.local 2>/dev/null || true
        echo "NEXT_PUBLIC_BACKEND_URL=http://localhost:3001" >> .env.local
        npm run dev

volumes:
  contracts-abi:
  shared:
